# Минимум игроков для старта (для тестов можно поставить 2-3)
min-players: 4

# Количество предателей.
# auto = подбирается по числу игроков: до 7 -> 1, 8-12 -> 2, 13+ -> 3
# Можно поставить число, например: impostors: 2
impostors: auto

# Точки (заполняются командами /amongus setlobby и /amongus setspawn)
lobby: null
spawn: null
